name: Generate Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore dayquest.keystore \
            -alias dayquest \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass DayQuest2026 \
            -keypass DayQuest2026 \
            -dname "CN=DayQuest, OU=Personal, O=Personal, L=City, S=State, C=RU"

          echo "====== COPY FROM HERE ======"
          base64 -w 0 dayquest.keystore
          echo ""
          echo "====== COPY UNTIL HERE ======"

      - name: Upload keystore (backup)
        uses: actions/upload-artifact@v4
        with:
          name: keystore-backup
          path: dayquest.keystore
